[package]
name = "nfsembed"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
description = "A Rust NFS Server implementation"
homepage = "https://github.com/pr0n00gler/nfsembed"
repository = "https://github.com/pr0n00gler/nfsembed"
readme = "README.md"
keywords = ["nfs"]
license = "BSD-3-Clause"
categories = ["network-programming", "filesystem"]
publish = true
include = ["src/**/*", "src/*", "examples/**/*", "tests/**/*", "benches/**/*", "Cargo.toml", "LICENSE", "README.md"]


[lib]
doctest = false

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"], default-features = false }
tracing = "0.1.31"
async-trait = "0.1.9"
bytes = "1"
hmac = "0.13"
rand = "0.8"
sha2 = "0.11"
thiserror = "1"
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash3_128"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
# The host-filesystem examples use a multi-threaded runtime and tokio::fs.
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
filetime = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[features]
strict = []

[[bench]]
name = "performance"
harness = false
